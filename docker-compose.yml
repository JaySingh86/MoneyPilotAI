# Local development stack (BACKEND_PLAN §4). Start with: docker compose up -d
# Every port binds to 127.0.0.1 so nothing is reachable from the local network.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      # Local admin only. Apps never connect as this user; see docker/postgres/init.sql for app roles.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mp_local_admin
      POSTGRES_DB: moneypilot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moneypilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # MinIO stopped publishing images to Docker Hub, and quay.io needs a login. coollabsio builds the upstream
    # release unchanged (same `server` command and settings). Local development only, never real data (Q-210).
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mp_local
      MINIO_ROOT_PASSWORD: mp_local_only
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

  mail:
    # Mailpit: catches all outgoing email locally (UI on http://localhost:8025).
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  pgdata:
  miniodata:
